[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-request-triage"
version = "0.1.0"
description = "Transparent scoring and routing of AI help requests into a ranked 90-day roadmap"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["triage"]

[tool.setuptools.package-data]
triage = ["config.toml", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
